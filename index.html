<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>周帅杭 · 简历</title>
    <style>
        /* ===== 极客星空·设计令牌 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 赛博朋克蓝 + 亮橙强调色 */
            --primary: #00f0ff; 
            --primary-soft: rgba(0, 240, 255, 0.15);
            --accent: #ff5e00; 
            --accent-soft: rgba(255, 94, 0, 0.2);
            --bg: #030811; /* 深邃黑蓝 */
            --surface: rgba(10, 18, 35, 0.6);
            --text: #e2e8f0;
            --text-light: #8b9bb4;
            --border: rgba(0, 240, 255, 0.15);
            --card-bg: rgba(8, 14, 26, 0.5);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            --shadow-hover: 0 0 25px rgba(0, 240, 255, 0.25);
            --gradient-text: linear-gradient(to right, #ffffff, #a0aec0);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 纯净深色背景 (无粒子) */
        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        html { scroll-behavior: smooth; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* 导航 */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; background: rgba(3, 8, 17, 0.7);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); z-index: 1000; padding: 12px 0;
        }
        .nav-container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .nav-logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        .nav-logo span { color: var(--primary); }
        .nav-center { display: flex; gap: 8px 16px; flex-wrap: wrap; justify-content: center; }
        .nav-center a { color: var(--text-light); text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-center a:hover { color: var(--primary); background: var(--primary-soft); }
        .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .icon-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

        .main-content { margin-top: 100px; }

        /* ===== Hero 核心区 ===== */
        .hero-section { padding: 60px 0 80px 0; }
        .hero-top-layout { display: flex; justify-content: space-between; align-items: flex-start; gap: 30px; }
        .hero-left-content { flex: 1; max-width: 800px; }
        .hero-right-content { flex-shrink: 0; padding: 8px; background: rgba(10, 18, 35, 0.4); border: 2px solid rgba(255, 255, 255, 0.08); border-radius: 18px; backdrop-filter: blur(10px); box-shadow: var(--shadow); transition: all 0.3s ease; position: relative; z-index: 5; }
        .hero-right-content:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .hero-formal-photo { display: block; width: clamp(110px, 15vw, 140px); height: auto; border-radius: 12px; object-fit: contain; }
        .hero-tag { font-size: 0.8rem; letter-spacing: 0.6em; color: var(--text-light); margin-bottom: 2rem; text-transform: uppercase; }
        .hero-main-row { display: flex; align-items: center; gap: 30px; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .hero-name { font-size: clamp(3.5rem, 8vw, 6.5rem); font-weight: 900; line-height: 1; color: #fff; letter-spacing: -0.02em; margin: 0; }
        .hero-dot { color: var(--accent); }
        .hero-avatar { width: clamp(80px, 12vw, 120px); height: clamp(80px, 12vw, 120px); border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.9); box-shadow: 0 0 30px rgba(255,255,255,0.1), 0 0 50px rgba(0, 240, 255, 0.3); transition: transform 0.3s ease; }
        .hero-avatar:hover { transform: scale(1.05) rotate(5deg); }
        .hero-slogan { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; color: #94a3b8; margin-bottom: 2.5rem; letter-spacing: -0.01em; }
        
        /* 🌟 删除了拖累性能的 img-skeleton 骨架屏动画 */

        /* 讨论区按钮及同行布局 (纯 CSS 复刻浅蓝倒角科技风) */
        .hero-desc-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; flex-wrap: wrap; margin-bottom: 3.5rem; }
        .hero-desc-row .hero-desc { margin-bottom: 0; flex: 1; min-width: 300px; }
        
        .hero-discuss-wrap {
            position: relative;
            display: inline-block;
            padding: 8px; /* 给边角的科技装饰线留出呼吸空间 */
        }
        
        /* 用多重线性渐变手搓四周的蓝色科技断线装饰 */
        .hero-discuss-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: 
                linear-gradient(to right, #8bbbe5 2px, transparent 2px) 0 15px / 2px 15px no-repeat,
                linear-gradient(to bottom, #8bbbe5 2px, transparent 2px) 15px 0 / 15px 2px no-repeat,
                
                linear-gradient(to left, #8bbbe5 2px, transparent 2px) 100% 15px / 2px 15px no-repeat,
                linear-gradient(to bottom, #8bbbe5 2px, transparent 2px) calc(100% - 15px) 0 / 15px 2px no-repeat,
                
                linear-gradient(to right, #8bbbe5 2px, transparent 2px) 0 calc(100% - 15px) / 2px 15px no-repeat,
                linear-gradient(to top, #8bbbe5 2px, transparent 2px) 15px 100% / 15px 2px no-repeat,
                
                linear-gradient(to left, #8bbbe5 2px, transparent 2px) 100% calc(100% - 15px) / 2px 15px no-repeat,
                linear-gradient(to top, #8bbbe5 2px, transparent 2px) calc(100% - 15px) 100% / 15px 2px no-repeat;
            transition: all 0.3s;
        }

        .discuss-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* 完美还原参考图的浅蓝/天蓝色渐变 */
            background: linear-gradient(180deg, #cbe5fa 0%, #8dc1eb 100%);
            /* 还原图片中的黑色楷体/衬线中式美学字体 */
            color: #0b1118;
            font-size: 3rem;
            font-family: 'STKaiti', 'KaiTi', '楷体', 'Times New Roman', serif;
            font-weight: 900;
            padding: 10px 48px;
            letter-spacing: 6px;
            text-decoration: none;
            /* 核心突破：纯CSS切割经典机甲倒角 */
            clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }
        
        .discuss-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(180deg, #dcf0ff 0%, #a4d2f8 100%);
        }
        .hero-discuss-wrap:hover::before {
            transform: scale(1.03);
            opacity: 0.5;
        }
        
        .hero-contact-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 2.5rem; display: flex; gap: 3rem; flex-wrap: wrap; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .contact-item { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 220px; }
        .contact-label { font-size: 0.85rem; color: #64748b; font-weight: 600; }
        .contact-val { font-size: 1.25rem; font-weight: 700; font-family: 'Courier New', Courier, monospace; color: #fff; letter-spacing: 0.05em; }

        /* ===== 通用组件 ===== */
        .section-title { font-size: 1.8rem; margin-bottom: 1.5rem; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; display: block; width: 8px; height: 24px; background: var(--primary); border-radius: 4px; box-shadow: 0 0 10px var(--primary); }
        .card { background: var(--card-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; padding: 28px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: all 0.3s ease; }
        .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-5px); border-color: rgba(0, 240, 255, 0.4); }

        /* =========================================================
           🌟 核心身份卡片区 (绝对不会失效的动态响应式滚动轨道)
           ========================================================= */
        .sticky-wrapper {
            position: relative;
            height: 300vh; 
            z-index: 10;
        }
        
        .sticky-content {
            position: -webkit-sticky; 
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            overflow: hidden;
        }
        
        .sticky-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .role-cards-container {
            width: 100%;
            overflow: hidden; 
        }
        
        .role-cards-track {
            display: flex;
            gap: 20px;
            --scroll-x: 0px;
            transform: translateX(var(--scroll-x));
            will-change: transform;
        }

        .role-card {
            flex: 0 0 85%; max-width: 320px; aspect-ratio: 3 / 4.2; position: relative;
            border-radius: 24px; overflow: hidden; scroll-snap-align: center; text-decoration: none;
            border: 1px solid var(--border); box-shadow: var(--shadow); display: block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .role-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.4);
            border-color: var(--primary);
        }
        
        /* =========================================================
           🌟 纯 CSS 绘制的数据流未来科技背景 (代替图片)
           ========================================================= */
        .tech-bg-container {
            position: absolute; inset: 0; z-index: 1; overflow: hidden;
        }
        
        .tech-bg-1 { --theme-r: 0; --theme-g: 240; --theme-b: 255; background: linear-gradient(145deg, #01121a 0%, #021a2b 100%); }
        .tech-bg-2 { --theme-r: 0; --theme-g: 150; --theme-b: 255; background: linear-gradient(145deg, #010a1a 0%, #051633 100%); }
        .tech-bg-3 { --theme-r: 140; --theme-g: 80; --theme-b: 255; background: linear-gradient(145deg, #07021a 0%, #110533 100%); }
        
        .tech-grid {
            position: absolute; inset: 0;
            background-image: 
                radial-gradient(rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25) 1px, transparent 1px),
                radial-gradient(rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1) 1px, transparent 1px);
            background-size: 20px 20px, 40px 40px;
            background-position: 0 0, 10px 10px;
            opacity: 0.6;
        }

        .tech-beam {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.9), transparent);
        }
        .beam-1 {
            height: 1px; width: 200%; top: 25%; left: -50%;
            transform: rotate(-25deg);
            box-shadow: 0 0 15px 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.6);
        }
        .beam-2 {
            height: 2px; width: 150%; top: 75%; left: -20%;
            transform: rotate(15deg);
            filter: blur(1px); opacity: 0.6;
        }
        .beam-horizontal {
            height: 3px; width: 150%; top: 50%; left: -25%;
            background: linear-gradient(90deg, transparent, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 1), transparent);
            filter: blur(2px); opacity: 0.8;
            box-shadow: 0 0 20px 3px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.8);
            animation: techPulse 3s infinite ease-in-out;
        }

        .tech-shape {
            position: absolute;
            border: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
            background: linear-gradient(135deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.05), transparent);
        }
        .shape-1 { width: 150px; height: 150px; top: -30px; right: -30px; transform: rotate(45deg); border-radius: 12px; animation: techFloat 6s infinite; }
        .shape-2 { width: 250px; height: 40px; bottom: 15%; left: -50px; transform: skewX(-45deg); }
        
        .tech-data {
            position: absolute; right: 24px; top: 40%;
            color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.4);
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px; line-height: 1.6; text-align: right;
            letter-spacing: 2px; font-weight: bold;
        }
        .tech-data span { display: block; }

        @keyframes techPulse {
            0%, 100% { opacity: 0.8; transform: scaleX(1); }
            50% { opacity: 0.4; transform: scaleX(0.9); }
        }
        @keyframes techFloat {
            0%, 100% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(10px) rotate(45deg); }
        }
        
        .role-card-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(3,8,17,0.7) 0%, rgba(3,8,17,0.1) 40%, rgba(3,8,17,0.98) 100%); z-index: 2; transition: background 0.3s; }
        .role-card:hover .role-card-overlay { background: linear-gradient(to bottom, rgba(3,8,17,0.5) 0%, rgba(3,8,17,0.05) 40%, rgba(3,8,17,0.95) 100%); }
        
        .role-card-content { position: relative; z-index: 3; display: flex; flex-direction: column; height: 100%; padding: 28px 24px; color: #fff; }
        
        .role-card-top { 
            font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; opacity: 0.95; margin-bottom: 20px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-family: 'Courier New', Courier, monospace; color: var(--primary); 
        }
        
        .role-card-title { 
            font-size: 2.2rem; font-weight: 900; line-height: 1.2; margin-top: auto; margin-bottom: 20px; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.4); 
            display: flex; flex-direction: column; gap: 6px; 
        }
        
        .role-card-bottom { font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; opacity: 0.95; transition: color 0.3s, transform 0.3s; }
        .role-card:hover .role-card-bottom { color: var(--primary); transform: translateX(6px); }

        /* ===== 核心经历 新版卡片式 UI ===== */
        .exp-list {
            display: flex;
            flex-direction: column;
            gap: 32px;
            margin-top: 10px;
        }
        .exp-card-new {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            opacity: 0; 
            transform: translateY(30px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 480px; 
        }
        .exp-card-new.animate-in {
            opacity: 1; 
            transform: translateY(0);
        }
        .exp-card-new:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.2);
        }
        
        .exp-card-img-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%; 
            z-index: 0;
        }
        .exp-card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.5s ease;
            cursor: zoom-in;
        }
        .exp-card-new:hover .exp-card-img-wrap img {
            transform: scale(1.05);
        }
        
        .exp-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(3,8,17,0) 0%, rgba(3,8,17,0.3) 40%, rgba(3,8,17,0.85) 75%, rgba(3,8,17,0.98) 100%);
            z-index: 1;
            pointer-events: none; 
            transition: background 0.3s;
        }
        .exp-card-new:hover .exp-card-overlay {
            background: linear-gradient(to bottom, rgba(3,8,17,0) 0%, rgba(3,8,17,0.15) 40%, rgba(3,8,17,0.7) 75%, rgba(3,8,17,0.95) 100%);
        }
        
        .exp-card-content {
            padding: 40px 32px 32px 32px;
            position: relative;
            z-index: 2;
            margin-top: auto;
        }
        .exp-card-title {
            font-size: 1.6rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .exp-card-meta {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-family: var(--font-mono);
        }
        .exp-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .exp-card-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .exp-card-new:hover .exp-card-tag {
            border-color: var(--primary-soft);
            color: var(--primary);
            background: rgba(0, 240, 255, 0.05);
        }
        .exp-card-desc {
            font-size: 1.05rem;
            color: var(--text);
            line-height: 1.7;
        }
        .exp-card-arrow {
            position: absolute;
            bottom: 32px;
            right: 32px;
            color: var(--text-light);
            transition: all 0.3s;
        }
        .exp-card-new:hover .exp-card-arrow {
            color: var(--primary);
            transform: translate(4px, -4px);
        }

        /* 🌟 删除了拖累性能的 img-skeleton 呼吸灯动画 */

        /* 进度条 */
        .skill-item { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
        .skill-name { width: 100px; font-weight: 500; color: var(--text); font-size: 0.95rem; }
        .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 10px; box-shadow: 0 0 10px var(--primary); }

        /* 布局 */
        /* 🌟 证书图片排版优化 */
        .cert-imgs { 
            display: flex; 
            gap: 20px; 
            margin-top: 24px; 
            flex-wrap: wrap; 
        }
        /* 增加证书图片的父容器用于显示骨架屏 */
        .cert-img-wrap {
            height: 220px; 
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .cert-img-wrap:hover {
            transform: translateY(-5px) scale(1.02); 
            border-color: var(--primary); 
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.2);
        }
        .cert-img { 
            height: 100%; 
            width: auto;   
            max-width: 100%;
            cursor: zoom-in; 
            object-fit: cover; 
            background: rgba(0,0,0,0.2); 
            display: block; /* 消除底部空隙 */
        }

        @media (min-width: 768px) { 
            .grid-2 { grid-template-columns: repeat(2,1fr); } 
            .role-card { 
                flex: 0 0 clamp(340px, 42%, 460px); 
                max-width: none; 
                aspect-ratio: 3 / 4.2; 
            }
        }
        @media (min-width: 1024px) { .grid-3 { grid-template-columns: repeat(3,1fr); } }

        /* 返回顶部 */
        #back-to-top { position: fixed; bottom: 30px; right: 30px; background: rgba(0, 240, 255, 0.1); color: var(--primary); border: 1px solid var(--primary); width: 45px; height: 45px; border-radius: 8px; font-size: 20px; cursor: pointer; z-index: 999; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #back-to-top:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }
        .footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 60px; color: var(--text-light); font-size: 0.9rem; }
        
        section { scroll-margin-top: 100px; }

        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .main-content { margin-top: 80px; }
            .nav-logo { font-size: 1.1rem; }
            .nav-center { gap: 6px; }
            .nav-center a { font-size: 0.85rem; padding: 4px 8px; }
            .hero-section { padding: 30px 0 50px 0; }
            .hero-top-layout { flex-direction: column-reverse; align-items: center; text-align: center; gap: 20px; }
            .hero-right-content { width: 120px; margin: 0 auto 10px auto; }
            .hero-main-row { justify-content: center; } 
            .hero-name { font-size: 3rem; } 
            .hero-slogan { font-size: 1.6rem; }
            .hero-desc { text-align: left; font-size: 1.05rem; } 
            
            /* 🌟 手机端讨论区按钮适配 */
            .hero-desc-row { flex-direction: column; align-items: center; gap: 24px; margin-bottom: 2.5rem; }
            .hero-desc-row .hero-desc { min-width: auto; width: 100%; text-align: left; }
            .discuss-btn { font-size: 2rem; padding: 10px 40px; }

            .hero-contact-card { padding: 1.5rem; gap: 1.2rem; flex-direction: column; align-items: center; text-align: center; }
            .card { padding: 20px; }

        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-container {
            text-align: center; transform: translateY(30px) scale(0.95);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 95%; max-width: 1000px;
            max-height: 90vh; overflow-y: auto; 
            padding: 30px 20px;
            scrollbar-width: none; 
        }
        .modal-container::-webkit-scrollbar { display: none; }
        .modal-overlay.active .modal-container { transform: translateY(0) scale(1); }
        
        .modal-close {
            position: absolute; top: 30px; right: 40px; background: transparent; border: none;
            color: #fff; cursor: pointer; transition: transform 0.3s, color 0.3s;
            padding: 10px; z-index: 10000;
        }
        .modal-close:hover { transform: rotate(90deg); color: #16c73b; }
        
        .ai-modal-title {
            font-size: clamp(3rem, 8vw, 6rem); font-weight: 900;

        }

            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 40px;
            align-items: center;
            width: 100%;
        }
        .modal-img {

            height: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: zoom-in; 
            
            /* 🌟 优化：加入图片底色占位，即便网速慢没加载出来，也会有个高级的框撑着 */
            background: rgba(255, 255, 255, 0.05);
            min-height: 100px; 
        }

        /* 🌟 深度重构：极客终端风格讨论区样式 */
        .discuss-container {

            flex-direction: column;

            text-align: left;

        .discuss-q {

            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            padding-left: 4px;
        }
        .discuss-q::before {
            content: '// ';
            color: var(--primary);
        }
        
        /* 终端窗口外框 */
        .terminal-window {
            background: #050a14;
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .terminal-window:focus-within {

            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.05);
            transform: translateY(-2px);
        }
        
        /* 科技扫描线光效 */
        .terminal-window::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.08) 50%, transparent);
            transform: translateY(-100%);
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }
        .terminal-window:focus-within::after {
            opacity: 1;
            animation: terminalScan 2.5s linear infinite;
        }
        @keyframes terminalScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 终端顶部状态栏 */
        .terminal-header {
            background: rgba(255, 255, 255, 0.04);

        }
        
        .discuss-submit-wrap {
            text-align: right;

        }
        .discuss-submit {
            background: var(--primary);
            color: #030811;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .discuss-submit:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }
        
        /* 🌟 新增：讨论区历史记录看板样式 */
        .feedback-board {
            margin-top: 60px;

        }
        .feedback-board-title::before {
            content: '>>';

        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .feedback-list {

        }
        .feedback-time {

        .feedback-ans { margin-bottom: 12px; }

        /* =========================================================
           🌟 独立大图预览层 (Lightbox Overlay)
           ========================================================= */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 100000;

        }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }

            cursor: zoom-out; 
        }
        .lightbox-overlay.active .lightbox-img { transform: scale(1); }
        
        body.modal-open { overflow: hidden; }

    </style>

            // 🌟 修改：监听弹窗打开，如果是讨论区，则自动拉取数据

                    fetchFeedback();

                document.getElementById(modalId).classList.remove('active');
                document.body.classList.remove('modal-open'); 
            };

                document.getElementById('lightboxImg').src = src;
                document.getElementById('lightbox').classList.add('active');
            };
            window.closeLightbox = function() {
                document.getElementById('lightbox').classList.remove('active');
                setTimeout(() => { document.getElementById('lightboxImg').src = ''; }, 300); 
            };

            // ==============================================================
            // 🌟 Supabase 数据库通信与提交逻辑
            // ==============================================================
            const supabaseUrl = 'https://uefwsneisirucxcflntg.supabase.co';
            const supabaseKey = 'sb_publishable_UQBZ3cHl_l7ye4vgcxJ-oA_jqkNAZc_';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // 防注入小工具
            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/[&<>'"]/g, tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag] || tag));
            }

            // 🌟 新增：拉取讨论区数据
            window.fetchFeedback = async function() {
                const listEl = document.getElementById('feedback-list');
                if(!listEl) return;
                
                try {
                    // 查询最近的 15 条反馈
                    const { data, error } = await supabase
                        .from('feedback')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(15);

                    if (error) throw error;

                    if (data.length === 0) {
                        listEl.innerHTML = '<div style="color:#8b9bb4; text-align:center; font-family: monospace;">// 暂无讨论记录，快来抢沙发吧！</div>';
                        return;
                    }

                    listEl.innerHTML = data.map(item => {
                        // 格式化时间
                        const dateObj = new Date(item.created_at);
                        const dateStr = dateObj.getFullYear() + '/' + (dateObj.getMonth()+1).toString().padStart(2, '0') + '/' + dateObj.getDate().toString().padStart(2, '0') + ' ' + dateObj.getHours().toString().padStart(2, '0') + ':' + dateObj.getMinutes().toString().padStart(2, '0');
                        
                        return `
                            <div class="feedback-card">
                                <div class="feedback-time">[SYS_TIME]: ${dateStr}</div>
                                ${item.optimization_suggestions ? `
                                    <div class="feedback-ans">
                                        <div class="feedback-ans-q"># Q1. 网页优化建议</div>
                                        <div class="feedback-ans-a">${escapeHTML(item.optimization_suggestions)}</div>
                                    </div>
                                ` : ''}
                                ${item.good_project_views ? `
                                    <div class="feedback-ans">
                                        <div class="feedback-ans-q"># Q2. 什么是好项目</div>
                                        <div class="feedback-ans-a">${escapeHTML(item.good_project_views)}</div>
                                    </div>
                                ` : ''}
                                ${item.ai_impact_views ? `
                                    <div class="feedback-ans">
                                        <div class="feedback-ans-q"># Q3. AI编程的影响</div>
                                        <div class="feedback-ans-a">${escapeHTML(item.ai_impact_views)}</div>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('');
                } catch (error) {
                    console.error('拉取记录失败:', error);
                    listEl.innerHTML = '<div style="color:#ff5f56; text-align:center; font-family: monospace;">[ERROR] 拉取讨论记录失败，请检查数据库 Select 权限。</div>';
                }
            };

            window.submitDiscussion = async function() {
                const q1 = document.getElementById('discuss-q1').value;
                const q2 = document.getElementById('discuss-q2').value;
                const q3 = document.getElementById('discuss-q3').value;

                // 简单的空白校验
                if (!q1.trim() && !q2.trim() && !q3.trim()) {
                    alert('请至少填写一项反馈内容哦！');
                    return;
                }

                // 交互体验：按钮状态变为“提交中...”并禁用防连点
                const btn = document.getElementById('discuss-submit-btn');
                const originalText = btn.innerText;
                btn.innerText = '提交中...';
                btn.disabled = true;

                try {

                        .from('feedback')

                    document.getElementById('discuss-q1').value = '';

                    fetchFeedback(); // 重新拉取数据
                    
                } catch (error) {
                    console.error('提交失败:', error);
                    alert('提交失败，请检查网络或相关配置。错误信息: ' + error.message);
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            };

                fragment.appendChild(backBtn);
                
                return fragment;
            }

            root.appendChild(buildPage());
            document.getElementById('printResume').addEventListener('click', () => { window.print(); });

            const initAdvancedAnimations = () => {
                const track = document.querySelector('.role-cards-track');
                const wrapper = document.querySelector('.sticky-wrapper');
                const container = document.querySelector('.role-cards-container');
                
                // 🌟 修复：彻底删除了庞大且容易在手机端卡死的 lazyImageObserver JS预判拦截代码

                if (!track || !wrapper || !container) return;

                let currentX = 0;
                let targetX = 0;

                const renderLoop = () => {
                    const rect = wrapper.getBoundingClientRect();
                    const windowHeight = window.innerHeight;
                    
                    const scrollableDistance = rect.height - windowHeight;
                    
                    let maxSlide = track.scrollWidth - container.clientWidth + 24; 
                    if (maxSlide < 0) maxSlide = 0;

                    if (scrollableDistance > 0) {
                        let progress = -rect.top / scrollableDistance;
                        
                        progress = Math.max(0, Math.min(1, progress));
                        
                        targetX = -(maxSlide * progress);
                    }

                    currentX += (targetX - currentX) * 0.06;
                    
                    if (Math.abs(targetX - currentX) < 0.1) currentX = targetX;
                    
                    track.style.setProperty('--scroll-x', `${currentX}px`);

                    requestAnimationFrame(renderLoop);
                };

                requestAnimationFrame(renderLoop);

                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate-in');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

                document.querySelectorAll('.exp-card-new').forEach((item, index) => {
                    item.style.transitionDelay = `${(index % 3) * 0.1}s`;
                    observer.observe(item);
                });
            };

            setTimeout(initAdvancedAnimations, 150);

        })();
    </script>
